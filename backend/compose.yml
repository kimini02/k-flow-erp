name: kflow-foundation
services:
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "log_parameter_max_length=0", "-c", "log_parameter_max_length_on_error=0", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_DB: ${DB_NAME:-kflow}
      POSTGRES_USER: ${DB_USERNAME:-kflow_local}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kflow_local_only}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
